name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revu
          POSTGRES_PASSWORD: revu_dev_password
          POSTGRES_DB: revu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://revu:revu_dev_password@localhost:5432/revu_test
      # The migrations create this role; API/worker tests connect as it so
      # row-level security applies exactly as in production.
      TEST_APP_DATABASE_URL: postgresql+psycopg://revu_app:revu_app_dev_password@localhost:5432/revu_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy packages/engine/src packages/db/src packages/ghapp/src packages/bench/src packages/observability/src apps/api/src apps/worker/src

      - name: Pytest
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Known-vulnerable dependencies and committed secrets fail the build.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads the whole history

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"

      - name: Python dependencies (pip-audit)
        run: |
          uv export --format requirements-txt --no-hashes --all-packages \
            --no-emit-workspace --no-dev --frozen -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps

      - name: Web dependencies (npm audit, shipped packages)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

      - name: Secrets in the history (gitleaks)
        run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3
          git /repo --no-banner --redact
