[project]
name = "worker"
version = "0.1.0"
description = "ARQ background worker — runs analysis jobs against the engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.26.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.1",
    "revu",
]

[tool.uv.sources]
revu = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
