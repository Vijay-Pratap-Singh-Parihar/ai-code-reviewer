[project]
name = "api"
version = "0.1.0"
description = "FastAPI application layer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.6.1",
    "pyjwt[crypto]>=2.10.0",
    "bcrypt>=4.2.1",
    "arq>=0.26.1",
    "cryptography>=43.0.3",
    "revu",
    "db",
]

[tool.uv.sources]
revu = { workspace = true }
db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
