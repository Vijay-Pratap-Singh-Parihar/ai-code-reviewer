[project]
name = "revu-bench"
version = "0.1.0"
description = "Benchmark harness for revu: datasets, matching, metrics, statistics and reports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.9",
    "revu",
]

[tool.uv.sources]
revu = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revu_bench"]
