[project]
name = "revu"
version = "0.1.0"
description = "Agentic code review engine: models, indexer, context retrieval, agents, verifier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9.2",
    "litellm>=1.52.0",
    "rustworkx>=0.15.1",
    "tree-sitter>=0.23.2",
    "tree-sitter-python>=0.23.4",
    "gitpython>=3.1.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revu"]
