[project]
name = "db"
version = "0.1.0"
description = "Shared SQLAlchemy models and declarative base for apps/api and apps/worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "revu",
]

[tool.uv.sources]
revu = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db"]
