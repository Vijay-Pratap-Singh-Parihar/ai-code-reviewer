[project]
name = "ghapp"
version = "0.1.0"
description = "GitHub App integration shared by apps/api and apps/worker: auth, webhook verification, REST client"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.2",
    "pyjwt[crypto]>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghapp"]
